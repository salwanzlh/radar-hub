server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirect bare /mitra to /mitra/
    location = /mitra {
        return 301 /mitra/;
    }

    # SPA fallback — all routes under /mitra/ resolve to index.html
    location /mitra/ {
        alias /usr/share/nginx/html/;
        index index.html;

        # Try the file, then directory, then fall back to index.html
        if (!-e $request_filename) {
            rewrite ^ /mitra/index.html last;
        }
    }

    # Serve index.html directly (no-cache)
    location = /mitra/index.html {
        alias /usr/share/nginx/html/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
