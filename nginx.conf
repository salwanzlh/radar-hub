server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes under /mitra resolve to index.html
    location /mitra/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /mitra/index.html;
    }

    # Redirect /mitra to /mitra/
    location = /mitra {
        return 301 /mitra/;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for index.html (always fetch latest)
    location = /mitra/index.html {
        alias /usr/share/nginx/html/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
